<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Slot Reels</title>
	</head>
	<body>
		<main class="stage" aria-label="Slot machine">
			<div class="stage-layout">
				<div class="stage-sign left" aria-hidden="true"><span>P</span><span>L</span><span>A</span><span>Y</span><span class="word-gap"></span><span>B</span><span>I</span><span>G</span></div>
				<section class="cabinet" aria-label="Three-reel slot machine display">
					<div class="ornament" aria-hidden="true"></div>
					<div class="machine-layout">
						<div class="led-wall left" aria-hidden="true">
							<span class="led-bulb" style="--i: 0; --delay: 0s; --led-color: #ff315a"></span>
							<span class="led-bulb" style="--i: 1; --delay: -0.14s; --led-color: #ff922d"></span>
							<span class="led-bulb" style="--i: 2; --delay: -0.28s; --led-color: #f4ff32"></span>
							<span class="led-bulb" style="--i: 3; --delay: -0.42s; --led-color: #37ff78"></span>
							<span class="led-bulb" style="--i: 4; --delay: -0.56s; --led-color: #2cf4ff"></span>
							<span class="led-bulb" style="--i: 5; --delay: -0.7s; --led-color: #477aff"></span>
							<span class="led-bulb" style="--i: 6; --delay: -0.84s; --led-color: #af4bff"></span>
							<span class="led-bulb" style="--i: 7; --delay: -0.98s; --led-color: #ff36c9"></span>
							<span class="led-bulb" style="--i: 8; --delay: -1.12s; --led-color: #ff315a"></span>
							<span class="led-bulb" style="--i: 9; --delay: -1.26s; --led-color: #ff922d"></span>
							<span class="led-bulb" style="--i: 10; --delay: -1.4s; --led-color: #37ff78"></span>
						</div>
						<div class="reel-frame" aria-label="Three spinning reels">
							<div class="result-line" aria-hidden="true"></div>
							<span class="side-rim left" aria-hidden="true"></span><span class="side-rim right" aria-hidden="true"></span> <span class="screw tl" aria-hidden="true"></span><span class="screw tr" aria-hidden="true"></span> <span class="screw bl" aria-hidden="true"></span><span class="screw br" aria-hidden="true"></span>
							<div class="reel" data-reel="0">
								<div class="track"></div>
								<div class="reel-window"></div>
							</div>
							<div class="reel" data-reel="1">
								<div class="track"></div>
								<div class="reel-window"></div>
							</div>
							<div class="reel" data-reel="2">
								<div class="track"></div>
								<div class="reel-window"></div>
							</div>
						</div>
						<div class="led-wall right" aria-hidden="true">
							<span class="led-bulb" style="--i: 0; --delay: 0s; --led-color: #ff315a"></span>
							<span class="led-bulb" style="--i: 1; --delay: -0.14s; --led-color: #ff922d"></span>
							<span class="led-bulb" style="--i: 2; --delay: -0.28s; --led-color: #f4ff32"></span>
							<span class="led-bulb" style="--i: 3; --delay: -0.42s; --led-color: #37ff78"></span>
							<span class="led-bulb" style="--i: 4; --delay: -0.56s; --led-color: #2cf4ff"></span>
							<span class="led-bulb" style="--i: 5; --delay: -0.7s; --led-color: #477aff"></span>
							<span class="led-bulb" style="--i: 6; --delay: -0.84s; --led-color: #af4bff"></span>
							<span class="led-bulb" style="--i: 7; --delay: -0.98s; --led-color: #ff36c9"></span>
							<span class="led-bulb" style="--i: 8; --delay: -1.12s; --led-color: #ff315a"></span>
							<span class="led-bulb" style="--i: 9; --delay: -1.26s; --led-color: #ff922d"></span>
							<span class="led-bulb" style="--i: 10; --delay: -1.4s; --led-color: #37ff78"></span>
						</div>
					</div>
				</section>
				<div class="stage-sign right" aria-hidden="true"><span>W</span><span>I</span><span>N</span><span class="word-gap"></span><span>B</span><span>I</span><span>G</span></div>
			</div>
		</main>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
